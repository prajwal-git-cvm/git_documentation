<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Git Commands — Practical Notes</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface2: #f5f5f4;
      --border: #e7e5e4;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #ea580c;
      --accent2: #0f766e;
      --code: #f5f5f4;
      --danger: #b42318;
      --shadow: 0 8px 30px #1c19170a;
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 88px
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    button,
    input {
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 66px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 26px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 750;
      letter-spacing: -.03em;
      white-space: nowrap
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, #9aa8ff, #5d6df2);
      display: grid;
      place-items: center;
      color: #10162a;
      font-weight: 900;
      font-size: 16px
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: .02em
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center
    }

    .icon-btn:hover {
      border-color: var(--accent)
    }

    .layout {
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      max-width: 1440px;
      margin: auto
    }

    .sidebar {
      height: calc(100vh - 66px);
      position: sticky;
      top: 66px;
      overflow: auto;
      padding: 26px 18px 30px;
      border-right: 1px solid var(--border)
    }

    .side-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .13em;
      color: var(--muted);
      font-weight: 750;
      padding: 0 12px;
      margin: 0 0 12px
    }

    .search-wrap {
      position: relative;
      margin: 0 4px 24px
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 36px 11px 12px;
      color: var(--text);
      outline: none
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 10px;
      color: var(--muted)
    }

    .nav {
      display: grid;
      gap: 4px
    }

    .nav a {
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      transition: .15s
    }

    .nav a span {
      font-size: 11px;
      opacity: .65;
      font-variant-numeric: tabular-nums
    }

    .nav a:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .nav a.active {
      background: color-mix(in srgb, var(--accent) 14%, var(--surface));
      color: var(--accent);
      font-weight: 650
    }

    .sidebar-note {
      margin: 26px 5px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface)
    }

    .sidebar-note strong {
      font-size: 12px;
      display: block;
      margin-bottom: 4px
    }

    .sidebar-note p {
      font-size: 12px;
      color: var(--muted);
      margin: 0
    }

    main {
      min-width: 0;
      padding: 42px clamp(20px, 5vw, 72px) 80px;
      max-width: 1060px
    }

    .hero {
      padding: 28px 0 34px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent2);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .12em
    }

    .eyebrow:before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--accent2);
      border-radius: 50%
    }

    h1 {
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.12;
      letter-spacing: -.055em;
      margin: 14px 0 14px
    }

    .hero p {
      max-width: 670px;
      color: var(--muted);
      font-size: 17px;
      margin: 0
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 22px
    }

    .pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 99px;
      padding: 5px 11px;
      font-size: 12px
    }

    section.doc-section {
      margin: 0 0 42px;
      scroll-margin-top: 90px
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px
    }

    .section-number {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--surface2);
      color: var(--accent);
      font-weight: 750;
      font-size: 13px
    }

    h2 {
      font-size: 23px;
      line-height: 1.25;
      letter-spacing: -.03em;
      margin: 3px 0 4px
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px
    }

    .topic {
      margin: 20px 0 0
    }

    h3 {
      font-size: 15px;
      margin: 0 0 8px;
      letter-spacing: -.01em
    }

    p {
      margin: 7px 0 12px
    }

    p,
    li {
      color: var(--muted)
    }

    .codebox {
      position: relative;
      margin: 10px 0 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
      background: var(--code)
    }

    .code-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px
    }

    .code-top .dots {
      display: flex;
      gap: 5px
    }

    .code-top .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52617b
    }

    .copy {
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11px
    }

    .copy:hover {
      border-color: var(--accent)
    }

    pre {
      margin: 0;
      padding: 15px 17px;
      overflow: auto;
      color: var(--text);
      font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
      tab-size: 2
    }

    code.inline {
      font: 12px ui-monospace, SFMono-Regular, Consolas, monospace;
      background: var(--surface2);
      padding: 2px 5px;
      border-radius: 5px;
      color: var(--accent)
    }

    .note {
      border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border));
      background: color-mix(in srgb, var(--accent) 7%, var(--surface));
      padding: 13px 15px;
      border-radius: 11px;
      margin: 13px 0;
      color: var(--muted);
      font-size: 13px
    }

    .note strong {
      color: var(--text)
    }

    .note.warning {
      border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
      background: color-mix(in srgb, var(--danger) 7%, var(--surface))
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 16px;
      font-size: 13px
    }

    th,
    td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top
    }

    th {
      color: var(--text);
      font-weight: 700;
      background: var(--surface)
    }

    td {
      color: var(--muted)
    }

    ul {
      padding-left: 21px
    }

    li {
      padding: 3px 0
    }

    .footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
      font-size: 12px
    }

    .no-results {
      display: none;
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      text-align: center
    }

    .mobile-menu {
      display: none
    }

    @media(max-width:900px) {
      .layout {
        grid-template-columns: 1fr
      }

      .sidebar {
        display: none;
        position: fixed;
        z-index: 30;
        top: 66px;
        left: 0;
        bottom: 0;
        width: min(300px, 86vw);
        height: auto;
        background: var(--bg);
        box-shadow: var(--shadow);
        border-right: 1px solid var(--border)
      }

      .sidebar.open {
        display: block
      }

      .mobile-menu {
        display: grid
      }

      main {
        padding: 28px 22px 60px
      }
    }

    @media(max-width:520px) {
      .topbar {
        padding: 0 14px;
        gap: 10px
      }

      .brand small {
        display: none
      }

      .top-actions {
        gap: 7px
      }

      .hero {
        padding-top: 18px
      }

      .hero p {
        font-size: 15px
      }

      h2 {
        font-size: 21px
      }

      pre {
        font-size: 12px;
        padding: 13px
      }

      table {
        display: block;
        overflow-x: auto
      }
    }
  </style>
</head>

  <script>
    document.querySelectorAll('.copy').forEach(button => {
  button.addEventListener('click', async () => {
    const code = button.closest('.codebox')?.querySelector('code')?.textContent;

    if (!code) return;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(code);
      } else {
        const area = document.createElement('textarea');
        area.value = code;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();

        if (!document.execCommand('copy')) {
          throw new Error('Copy command failed');
        }

        area.remove();
      }

      button.textContent = 'Copied!';
    } catch (error) {
      button.textContent = 'Copy failed';
      console.error('Copy failed:', error);
    }

    setTimeout(() => {
      button.textContent = 'Copy';
    }, 1400);
  });
});
  </script>
</body>

</html>
